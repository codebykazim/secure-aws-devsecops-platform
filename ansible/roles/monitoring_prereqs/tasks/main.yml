---
- name: Download Node Exporter
  unarchive:
    src: https://github.com/prometheus/node_exporter/releases/download/v1.7.0/node_exporter-1.7.0.linux-amd64.tar.gz
    dest: /tmp/
    remote_src: yes
    creates: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter

- name: Install Node Exporter binary
  copy:
    src: /tmp/node_exporter-1.7.0.linux-amd64/node_exporter
    dest: /usr/local/bin/node_exporter
    mode: '0755'
    remote_src: yes

- name: Create Node Exporter systemd service file
  copy:
    dest: /etc/systemd/system/node_exporter.service
    content: |
      [Unit]
      Description=Node Exporter
      After=network.target
      
      [Service]
      User=root
      ExecStart=/usr/local/bin/node_exporter
      
      [Install]
      WantedBy=multi-user.target

- name: Start and enable Node Exporter
  systemd:
    name: node_exporter
    daemon_reload: yes
    state: started
    enabled: yes

- name: Allow Node Exporter port in UFW
  ufw:
    rule: allow
    port: '9100'
    proto: tcp
