---
- name: Configure Jenkins Master
  hosts: jenkins_master
  become: yes
  roles:
    - common
    - docker
    - jenkins_master
    - linux_hardening
    - firewall
    - monitoring_prereqs

- name: Configure Jenkins Agent
  hosts: jenkins_agent
  become: yes
  roles:
    - common
    - docker
    - jenkins_agent
    - linux_hardening
    - firewall
    - monitoring_prereqs
